[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#0f172a"
textColor = "#f1f5f9"
linkColor = "#22d3ee"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseRadius = "12px"
baseFontSize = 14
codeFontSize = "0.875rem"
linkUnderline = false

blueColor = "#818cf8"
greenColor = "#34d399"
redColor = "#f87171"
yellowColor = "#fbbf24"
violetColor = "#a78bfa"

chartCategoricalColors = ["#6366f1", "#8b5cf6", "#06b6d4", "#22d3ee", "#34d399", "#fbbf24", "#f87171"]

[theme.sidebar]
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#0f172a"
textColor = "#f1f5f9"
borderColor = "#1e293b"
